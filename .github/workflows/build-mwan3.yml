name: Build Tenda BE12 Pro with mwan3 (双WAN负载均衡)

on:
  workflow_dispatch:
    inputs:
      config:
        description: 'Defconfig 名称'
        required: false
        default: 'mt7987_mt7992_mwan3'
        type: choice
        options:
          - mt7987_mt7992_mwan3
          - mt7987_mt7992
          - full
          - minimal
      jobs:
        description: '并行 job 数（影响资源占用）'
        required: false
        default: '4'
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ImmortalWrt firmware (${{ github.event.inputs.config || 'mt7987_mt7992_mwan3' }})
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 1

      - name: Prepare build environment
        run: |
          echo "=== Free disk space ==="
          df -h
          echo "=== Free RAM ==="
          free -h
          echo "=== CPU count ==="
          nproc
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ccache ecj fastjar file g++ gawk \
            gettext git java-propose-classpath libelf-dev libncurses5-dev \
            libncursesw5-dev libssl-dev python3 python3-distutils \
            python3-setuptools rsync subversion swig time unzip wget \
            xsltproc zlib1g-dev

      - name: Cache toolchain and feeds
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: |
            staging_dir
            dl
            feeds
          key: ${{ runner.os }}-toolchain-${{ hashFiles('**/Makefile', 'feeds.conf.default') }}
          restore-keys: |
            ${{ runner.os }}-toolchain-

      - name: Apply defconfig
        run: |
          CONFIG="${{ github.event.inputs.config || 'mt7987_mt7992_mwan3' }}"
          echo "Using defconfig: $CONFIG"
          if [ ! -f "defconfig/${CONFIG}.config" ]; then
            echo "ERROR: defconfig/${CONFIG}.config not found!"
            ls -la defconfig/
            exit 1
          fi
          cp "defconfig/${CONFIG}.config" .config
          echo "=== Config applied. Size: ==="
          wc -l .config
          echo "=== Verifying mwan3 is enabled ==="
          grep -E "^CONFIG_PACKAGE_(mwan3|luci-app-mwan3|kmod-ipt-conntrack|kmod-ipt-conntrack-extra|kmod-ipt-ipopt)=" .config || {
            echo "ERROR: mwan3 chain missing!"
            exit 1
          }

      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          echo "=== Installed feeds ==="
          ls feeds/

      - name: defconfig
        run: make defconfig

      - name: Build firmware
        env:
          FORCE: 1
        run: |
          JOBS="${{ github.event.inputs.jobs || '4' }}"
          echo "Building with -j${JOBS}"
          make -j${JOBS} || {
            echo "=== Build failed. Last 100 lines of log: ==="
            tail -100 build.log 2>/dev/null || true
            exit 1
          }

      - name: List build outputs
        run: |
          echo "=== Build outputs ==="
          find bin/ -type f \( -name "*.tar.gz" -o -name "*.itb" -o -name "*.bin" -o -name "*squashfs*" -o -name "*sysupgrade*" \) | sort
          echo "=== File sizes ==="
          du -sh bin/targets/*/*/ 2>/dev/null
          echo "=== Manifests ==="
          ls -la bin/targets/mediatek/filogic/ 2>/dev/null

      - name: Prepare artifacts
        run: |
          cd bin/targets/mediatek/filogic/
          mkdir -p artifacts
          cp -v *tenda*be12*pro* artifacts/ 2>/dev/null || true
          cp -v *tenda_be12* artifacts/ 2>/dev/null || true
          cp -v *.tar.gz artifacts/ 2>/dev/null || true
          cp -v *.itb artifacts/ 2>/dev/null || true
          ls -lh artifacts/

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tenda-be12-pro-firmware-${{ github.event.inputs.config || 'mt7987_mt7992_mwan3' }}
          path: bin/targets/mediatek/filogic/artifacts/
          retention-days: 30
          if-no-files-found: error

      - name: Generate build info
        run: |
          cat > BUILD_INFO.txt <<EOF
          Build: ${{ github.event.inputs.config || 'mt7987_mt7992_mwan3' }}
          Commit: ${{ github.sha }}
          Branch: ${{ github.ref }}
          Date: $(date -u)
          EOF
          cat BUILD_INFO.txt
